<!-- @dsCard group="Components" viewport="700x330" subtitle="Cart pill, drawer rows, subtotal, checkout" name="Commerce" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}
 .caps{font-family:var(--sf-font-heading);letter-spacing:var(--sf-track-caps);text-transform:uppercase;font-size:var(--sf-text-xs)}
 .well{background:var(--surface-well);background-image:repeating-linear-gradient(135deg,rgba(235,203,110,.07) 0 8px,rgba(235,203,110,0) 8px 16px)}
</style></head><body>
<div style="display:flex;gap:.6rem;align-items:center;margin-bottom:16px">
  <span style="display:inline-flex;align-items:center;gap:.5rem;font-family:var(--sf-font-heading);font-size:var(--sf-text-sm);letter-spacing:var(--sf-track-nav);text-transform:uppercase;padding:.45rem 1rem;border-radius:999px;border:1px solid var(--sf-line-strong);background:var(--action-ghost-bg);color:var(--sf-ink-100)">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 6h3l2.2 9.4A2 2 0 0 0 11.1 17h6.6a2 2 0 0 0 1.95-1.55L21 9H8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="20" r="1.3" fill="currentColor"/><circle cx="17.5" cy="20" r="1.3" fill="currentColor"/></svg>
    Cart <span style="min-width:1.35rem;height:1.35rem;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--sf-gold-400);color:var(--action-primary-ink);font-size:var(--sf-text-2xs);letter-spacing:0">2</span></span>
</div>
<aside style="max-width:26rem;display:flex;flex-direction:column;border:1px solid var(--sf-line);border-radius:12px;overflow:hidden;background:var(--surface-card);box-shadow:var(--sf-shadow-float)">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.4rem;border-bottom:1px solid var(--border-card)">
    <h2 style="font-family:var(--sf-font-display);font-size:var(--sf-text-lg);color:var(--text-heading)">Your cart</h2>
    <span style="display:flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;border:1px solid var(--sf-line-strong);border-radius:999px;color:var(--sf-ink-300)"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></header>
  <div style="display:flex;flex-direction:column;gap:1px;background:rgba(162,156,196,.14)">
  <div style="display:flex;gap:1rem;padding:1.1rem 1.4rem;background:var(--surface-card)">
    <div class="well" style="flex:none;width:3.25rem;height:4.4rem;border-radius:4px;border:1px solid rgba(235,203,110,.25)"></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem">
      <span style="font-family:var(--sf-font-display);font-size:1.2rem;line-height:1.2;color:var(--text-heading)">The Starfall Setting</span>
      <span class="caps" style="letter-spacing:var(--sf-track-nav);color:var(--text-meta)">Hardcover + PDF</span>
      <span class="caps" style="letter-spacing:var(--sf-track-nav);color:var(--text-label)">Remove</span></div>
    <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:.25rem">
      <span class="caps" style="font-size:var(--sf-text-sm);letter-spacing:var(--sf-track-nav);color:var(--text-accent);white-space:nowrap">$24</span>
      <span style="font-size:var(--sf-text-xs);color:var(--text-meta)">×1</span></div></div><div style="display:flex;gap:1rem;padding:1.1rem 1.4rem;background:var(--surface-card)">
    <div class="well" style="flex:none;width:3.25rem;height:4.4rem;border-radius:4px;border:1px solid rgba(235,203,110,.25)"></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem">
      <span style="font-family:var(--sf-font-display);font-size:1.2rem;line-height:1.2;color:var(--text-heading)">The Essence Ledger</span>
      <span class="caps" style="letter-spacing:var(--sf-track-nav);color:var(--text-meta)">GM toolkit · PDF</span>
      <span class="caps" style="letter-spacing:var(--sf-track-nav);color:var(--text-label)">Remove</span></div>
    <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:.25rem">
      <span class="caps" style="font-size:var(--sf-text-sm);letter-spacing:var(--sf-track-nav);color:var(--text-accent);white-space:nowrap">$8</span>
      <span style="font-size:var(--sf-text-xs);color:var(--text-meta)">×1</span></div></div>
  </div>
  <footer style="display:flex;flex-direction:column;gap:.9rem;padding:1.3rem 1.4rem;border-top:1px solid var(--border-card);background:var(--surface-raised)">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="caps" style="color:var(--text-meta)">Subtotal</span>
      <span style="font-family:var(--sf-font-display);font-size:var(--sf-text-lg);color:var(--text-accent)">$32</span></div>
    <p style="font-size:var(--sf-text-xs);line-height:1.5;color:var(--text-meta)">PDFs are delivered immediately. Print ships in 3–5 days.</p>
    <span style="text-align:center;font-family:var(--sf-font-heading);font-size:1rem;letter-spacing:.13em;text-transform:uppercase;color:var(--action-primary-ink);background:var(--action-primary-bg);padding:.8rem;border-radius:999px;box-shadow:var(--sf-glow-button)">Checkout</span></footer>
</aside>
</body></html>
