<!-- @dsCard group="Brand" viewport="700x160" subtitle="One hue per band; violet default, teal for the sea, gold for commerce" name="Ambient hue zones" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row" style="gap:12px">
  <div style="position:relative;width:200px;height:88px;border-radius:12px;background:var(--surface-page);overflow:hidden"><div style="position:absolute;inset:0;background:var(--sf-ambient-violet)"></div><span class="lbl" style="position:absolute;left:10px;bottom:8px">violet</span></div>
  <div style="position:relative;width:200px;height:88px;border-radius:12px;background:var(--surface-page);overflow:hidden"><div style="position:absolute;inset:0;background:var(--sf-ambient-teal)"></div><span class="lbl" style="position:absolute;left:10px;bottom:8px">teal</span></div>
  <div style="position:relative;width:200px;height:88px;border-radius:12px;background:var(--surface-page);overflow:hidden"><div style="position:absolute;inset:0;background:var(--sf-ambient-gold-bottom)"></div><span class="lbl" style="position:absolute;left:10px;bottom:8px">gold</span></div>
</div>
</body></html>
