<!-- @dsCard group="Brand" viewport="700x180" subtitle="Black shadows for depth, gold glow for the sacred" name="Elevation & glow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row" style="gap:18px">
  <div class="sw"><div style="width:120px;height:64px;border-radius:12px;background:var(--surface-card);border:1px solid var(--sf-line);box-shadow:var(--sf-shadow-card)"></div><span class="lbl">card 0 18 40 /.5</span></div>
  <div class="sw"><div style="width:120px;height:64px;border-radius:12px;background:var(--surface-card);border:1px solid var(--sf-line);box-shadow:var(--sf-shadow-float)"></div><span class="lbl">float 0 28 70 /.55</span></div>
  <div class="sw"><div style="width:120px;height:64px;border-radius:999px;background:linear-gradient(180deg,var(--sf-gold-300),var(--sf-gold-500));box-shadow:var(--sf-glow-button)"></div><span class="lbl">gold glow</span></div>
  <div class="sw"><div style="width:120px;height:64px;border-radius:14px;padding:1px;background:var(--sf-border-gradient)"><div style="width:100%;height:100%;border-radius:13px;background:var(--surface-well)"></div></div><span class="lbl">gradient hairline</span></div>
</div>
</body></html>
