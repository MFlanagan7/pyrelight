<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row" style="align-items:center">
<div class="sw"><div style="width:74px;height:44px;border-radius:999px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">pill 999</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:14px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">panel 14</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:12px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">card 12</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:11px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">frame 11</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:10px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">cover 10</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:6px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">thumb 6</span></div><div class="sw"><div style="width:74px;height:44px;border-radius:4px;border:1px solid var(--sf-line-gold);background:var(--surface-card)"></div><span class="lbl">chip 4</span></div>
</div>
</body></html>
