<!-- @dsCard group="Brand" viewport="700x200" subtitle="Four layers over key art, in this order" name="Hero scrim stack" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div style="position:relative;height:120px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#24304a,#4a3c5e 50%,#1b2430)">
  <div style="position:absolute;inset:0;background:var(--sf-scrim-top)"></div>
  <div style="position:absolute;inset:0;background:var(--sf-scrim-bottom)"></div>
  <div style="position:absolute;inset:0;background:var(--sf-scrim-vignette)"></div>
  <div style="position:absolute;inset:0;background:var(--sf-scrim-glow)"></div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sf-font-display);font-size:34px;letter-spacing:.08em;color:var(--sf-gold-400);text-shadow:var(--sf-glow-h1)">Starfall</div>
</div>
<p class="mono" style="margin-top:10px">1 top scrim · 2 bottom fade to page bg · 3 edge vignette · 4 small gold glow behind the wordmark</p>
</body></html>
