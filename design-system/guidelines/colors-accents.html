<!-- @dsCard group="Colors" viewport="700x130" subtitle="Gold leads; violet, lilac and teal support" name="Brand accents" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-gold-300)"></div><span class="lbl">gold light</span><span class="mono">#F3DC98</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-gold-400)"></div><span class="lbl">ESSENCE GOLD</span><span class="mono">#EBCB6E</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-gold-500)"></div><span class="lbl">gold deep</span><span class="mono">#E3BE55</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-violet-600)"></div><span class="lbl">dusk violet</span><span class="mono">#3A2E5C</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-lilac-400)"></div><span class="lbl">muted lilac</span><span class="mono">#A29CC4</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-teal-600)"></div><span class="lbl">deep teal</span><span class="mono">#2C6E7F</span></div>
<div class="sw"><div class="chip" style="width:92px;background:var(--sf-teal-300)"></div><span class="lbl">teal light</span><span class="mono">#7FD3E4</span></div>
</div>
</body></html>
