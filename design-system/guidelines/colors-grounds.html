<!-- @dsCard group="Colors" viewport="700x130" subtitle="Every Starfall surface, darkest to lightest" name="Navy grounds" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-900)"></div><span class="lbl">footer</span><span class="mono">#0A0917</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-850)"></div><span class="lbl">page</span><span class="mono">#0D0C1B</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-800)"></div><span class="lbl">hero / well</span><span class="mono">#100F21</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-750)"></div><span class="lbl">brand navy</span><span class="mono">#141328</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-700)"></div><span class="lbl">card</span><span class="mono">#15142A</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-650)"></div><span class="lbl">raised</span><span class="mono">#171630</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-navy-600)"></div><span class="lbl">card hover</span><span class="mono">#1B1934</span></div>
</div>
</body></html>
