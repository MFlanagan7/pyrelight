<!-- @dsCard group="Colors" viewport="700x190" subtitle="Six weights of text on navy — all ≥4.5:1 on #0D0C1B" name="Ink ramp" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:9px">
  <p style="color:var(--sf-ink-100);font-size:15px">Headings — #EFECF6 <span class="mono">--text-heading</span></p>
  <p style="color:var(--sf-ink-200);font-size:15px">Body over imagery — #DDD8EC <span class="mono">--text-over-image</span></p>
  <p style="color:var(--sf-ink-300);font-size:15px">Body — #C8C2DC <span class="mono">--text-body</span></p>
  <p style="color:var(--sf-ink-400);font-size:15px">Card copy — #ADA6C8 <span class="mono">--text-body-card</span></p>
  <p style="color:var(--sf-ink-500);font-size:15px">Meta &amp; counts — #8F88AF <span class="mono">--text-meta</span></p>
  <p style="color:var(--sf-ink-600);font-size:15px">Legal only — #7C7599 <span class="mono">--text-legal</span></p>
</div>
</body></html>
