<!-- @dsCard group="Colors" viewport="700x120" subtitle="Reserved for PDFs and printed pages — never a website section" name="Parchment (print only)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--sf-parchment-100); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:6px">
  <p style="color:var(--sf-parchment-ink);font-family:var(--sf-font-body);font-size:15px">Parchment ground #F5F0E4 with ink #2A2636, rule #C9B98F.</p>
  <p style="color:var(--sf-parchment-ink);font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.16em;text-transform:uppercase">Do not use on the site — a light band inside a dark site reads as a bug</p>
</div>
</body></html>
