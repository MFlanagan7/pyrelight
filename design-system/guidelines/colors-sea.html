<!-- @dsCard group="Colors" viewport="700x120" subtitle="The one non-navy ground on the site" name="Sea band" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--sf-sea-850); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row" style="align-items:center">
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-sea-900)"></div><span class="lbl">sea deep</span><span class="mono">#0A151C</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-sea-850)"></div><span class="lbl">sea band</span><span class="mono">#0B1A22</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-ink-sea-100)"></div><span class="lbl">sea ink</span><span class="mono">#EAF6F8</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-ink-sea-300)"></div><span class="lbl">sea body</span><span class="mono">#C9E2E8</span></div>
<div class="sw"><div class="chip" style="width:80px;background:var(--sf-teal-300)"></div><span class="lbl">sea label</span><span class="mono">#7FD3E4</span></div>
</div>
</body></html>
