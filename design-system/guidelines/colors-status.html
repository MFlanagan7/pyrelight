<!-- @dsCard group="Colors" viewport="700x120" subtitle="Free, premium, and pantheon states" name="Status & commerce" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div class="row" style="align-items:center;gap:14px">
  <span style="font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#141328;background:rgba(235,203,110,.92);border:1px solid var(--sf-gold-400);padding:4px 10px;border-radius:999px">Premium</span>
  <span style="font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sf-status-free);background:rgba(13,12,27,.7);border:1px solid rgba(155,211,168,.6);padding:4px 10px;border-radius:999px">Free</span>
  <span style="font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sf-status-dead)">Deceased</span>
  <span style="font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sf-gold-400)">Stranded</span>
  <span style="font-family:var(--sf-font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sf-status-free)">Ascendant</span>
</div>
<p class="mono" style="margin-top:14px">--sf-status-free #9BD3A8 · --sf-status-dead #C98A8A · --sf-status-stranded #EBCB6E</p>
</body></html>
