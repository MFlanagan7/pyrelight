<!-- @dsCard group="Type" viewport="700x210" subtitle="H1, section headings, card titles, quotes, numerals" name="Cormorant Garamond — display" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 20px; font-family: var(--sf-font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .lbl { font-family: var(--sf-font-heading); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-meta); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--text-meta); }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 92px; height: 46px; border-radius: 6px; border: 1px solid var(--sf-line); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px;font-family:var(--sf-font-display);color:var(--text-heading)">
  <div style="font-size:48.8px;line-height:1.05;letter-spacing:.08em;color:var(--sf-gold-400)">Starfall</div>
  <div style="font-size:39px;line-height:1.15">The sea god is dead</div>
  <div style="font-size:25px;line-height:1.2">The Starfall Setting</div>
  <div style="font-size:22px;font-style:italic">“I read the essence chapter…”</div>
</div>
<p class="mono" style="margin-top:10px">3.052 / 2.441 / 1.5625 rem · weight 400 always · tracking .08em on the wordmark only</p>
</body></html>
